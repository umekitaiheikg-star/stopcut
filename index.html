<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>止切長さ計算</title>

<style>
body{
    font-family:"メイリオ","Meiryo","Yu Gothic",sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    margin:0;
    padding:12px;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
}

.container{
    width:100%;
    max-width:500px;
    margin:0 auto;
    background:#ffffff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    box-sizing:border-box;
}

h2{
    text-align:center;
    color:#ffffff;
    background:#0077cc;
    padding:15px;
    border-radius:10px;
    margin-top:0;
}

.row{
    display:flex;
    align-items:center;
    margin:12px 0;
}

label{
    width:120px;
    font-weight:bold;
    color:#003366;
}

input, select{
    flex:1;
    min-width:0;
    min-height:48px;
    padding:12px;
    font-size:18px;
    border:2px solid #3399ff;
    border-radius:8px;
    background:#f8fbff;
    transition:0.2s;
    box-sizing:border-box;
}

input:focus, select:focus{
    outline:none;
    border-color:#ff9800;
    background:#fff8e1;
    box-shadow:0 0 8px rgba(255,152,0,.4);
}

.result{
    background:linear-gradient(135deg,#fff176,#ffd54f);
    border:2px solid #f9a825;
    border-radius:10px;
    padding:15px;
    margin-top:20px;
}

.result div{
    font-size:22px;
    font-weight:bold;
    color:#d84315;
    padding:8px 0;
}

#error{
    color:#d50000;
    font-weight:bold;
    margin-top:15px;
    background:#ffebee;
    border-radius:8px;
    padding:8px;
}

@media (max-width:480px){
    body{
        padding:8px;
    }

    .container{
        padding:14px;
        border-radius:12px;
    }

    h2{
        font-size:22px;
        padding:12px;
    }

    .row{
        align-items:stretch;
        gap:6px;
        margin:10px 0;
    }

    label{
        width:105px;
        min-width:105px;
        display:flex;
        align-items:center;
        font-size:14px;
    }

    input, select{
        min-height:50px;
        font-size:18px;
    }

    .result{
        margin-top:14px;
        padding:12px;
    }

    .result div{
        font-size:18px;
        padding:7px 0;
    }
}


.input-group{
    flex:1;
    min-width:0;
}
.input-group input{
    width:100%;
}
.quick-options{
    display:flex;
    gap:6px;
    margin-top:6px;
}
.quick-options button{
    flex:1;
    min-height:40px;
    padding:6px 10px;
    font-size:16px;
    border:2px solid #3399ff;
    border-radius:8px;
    background:#f8fbff;
    color:#003366;
    cursor:pointer;
}
.quick-options button:active,
.quick-options button:hover{
    background:#fff8e1;
    border-color:#ff9800;
}

@media (max-width:480px){
    .quick-options button{
        min-height:44px;
        font-size:17px;
    }
}

</style>
</head>

<body>

<div class="container">

<h2>止切長さ計算</h2>

<div class="row">
<label>切巾</label>
<div class="input-group">
<input id="width" inputmode="decimal">
<div class="quick-options" data-target="width">
<button type="button">25</button>
<button type="button">23</button>
<button type="button">20</button>
</div>
</div>
</div>

<div class="row">
<label>穴（先端）</label>
<div class="input-group">
<input id="frontHole" inputmode="decimal">
<div class="quick-options" data-target="frontHole">
<button type="button">25</button>
</div>
</div>
</div>

<div class="row">
<label>穴（尾端）</label>
<div class="input-group">
<input id="rearHole" inputmode="decimal">
<div class="quick-options" data-target="rearHole">
<button type="button">25</button>
</div>
</div>
</div>

<div class="row">
<label>アングル</label>
<select id="angleType">
<option value=""></option>
<option value="75">L75</option>
<option value="65">L65</option>
<option value="50">L50</option>
</select>
</div>

<div class="row">
<label>ゲージ（背）</label>
<input id="gauge">
</div>

<div class="row">
<label>ゲージ（刃）</label>
<input id="revGauge">
</div>

<div class="row">
<label>角度</label>
<input id="angle" list="angleOptions">
<datalist id="angleOptions">
<option value="30">
<option value="45">
</datalist>
</div>

<div class="row">
<label>X</label>
<input id="x">
</div>

<div class="row">
<label>Y</label>
<input id="y">
</div>

<div id="error"></div>

<div class="result">

<div>先端 a寸法：<span id="fa"></span></div>
<div>先端 b寸法：<span id="fb"></span></div>

<hr>

<div>尾端 a寸法：<span id="ra"></span></div>
<div>尾端 b寸法：<span id="rb"></span></div>

</div>

</div>

<script>

const formFields=[...document.querySelectorAll("input, select")];

formFields.forEach(i=>{
    i.addEventListener("input",calc);
    i.addEventListener("change",calc);
    i.addEventListener("keydown",e=>{
        if(e.key==="Enter"){
            e.preventDefault();
            const index=formFields.indexOf(e.currentTarget);
            const next=formFields[index+1];
            if(next){
                next.focus();
                if(next.tagName==="INPUT") next.select();
            }
        }
    });
});

document.querySelectorAll(".quick-options button").forEach(button=>{
    button.addEventListener("click",()=>{
        const target=document.getElementById(button.parentElement.dataset.target);
        target.value=button.textContent.trim();
        calc();
        target.focus();
    });
});

function num(v){
    if(v==="") return "";
    return Number(v);
}

function roundExcel(v){
    return Math.round(v);
}

function calc(){

    document.getElementById("error").textContent="";
    const angleTypeEl=document.getElementById("angleType");

    const ids=["width","frontHole","rearHole","gauge","revGauge","x","y","angle"];

    for(const id of ids){

        const v=document.getElementById(id).value.trim();

        if(v!=="" && isNaN(v)){
            document.getElementById("error").textContent="数値を入力してください。";
            return;
        }

    }

    const W=num(width.value);
    const FH=num(frontHole.value);
    const RH=num(rearHole.value);
    const X=num(x.value);
    const Y=num(y.value);
    const angleType=angleTypeEl.value;

    // 選択したアングルに応じてゲージを自動設定
    const gaugeMap={
        "75":{back:40, blade:35},
        "65":{back:35, blade:30},
        "50":{back:27, blade:23}
    };

    if(gaugeMap[angleType]){
        gauge.value=gaugeMap[angleType].back;
        revGauge.value=gaugeMap[angleType].blade;
    }

    const G=num(gauge.value);
    const RG=num(revGauge.value);

    let ang;

    if(angle.value!==""){
        ang=num(angle.value);
    }else if(X!=="" && Y!=="" && X!==0){
        ang=Math.atan(Y/X)*180/Math.PI;
    }else{
        ang="";
    }

    if(W===""||FH===""||G===""){
        fa.textContent="";
        fb.textContent="";
        ra.textContent="";
        rb.textContent="";
        return;
    }

    if(ang===""){
        fa.textContent="";
        fb.textContent="";
        return;
    }

    const r=ang*Math.PI/180;

    // Excelの COS()^-1 = 1/COS()
    const sec=1/Math.cos(r);

    const tan=Math.tan(r);

    const frontA=roundExcel(((G-sec*W)/tan)+FH)+1;

    const frontB=roundExcel((((G-sec*W)/tan)+FH)*tan)+1;

    fa.textContent=frontA;
    fb.textContent=frontB;

    if(RH!=="" && RG!==""){

        const rearA=roundExcel(((RG-sec*W)/tan)+RH)+1;

        const rearB=roundExcel((((RG-sec*W)/tan)+RH)*tan)+1;

        ra.textContent=rearA;
        rb.textContent=rearB;

    }else{

        ra.textContent="";
        rb.textContent="";

    }

}

</script>

</body>
</html>
