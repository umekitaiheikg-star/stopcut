<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>止切長さ計算</title>

<style>
body{
    font-family:sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}
.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}
h2{
    text-align:center;
}
.row{
    display:flex;
    align-items:center;
    margin:10px 0;
}
label{
    width:120px;
}
input{
    flex:1;
    padding:10px;
    font-size:16px;
}
.result{
    background:#eef6ff;
    padding:12px;
    border-radius:8px;
    margin-top:20px;
}
.result div{
    padding:6px 0;
    font-size:18px;
}
#error{
    color:red;
    font-weight:bold;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h2>止切長さ計算</h2>

<div class="row">
<label>切巾</label>
<input id="width">
</div>

<div class="row">
<label>穴位置（先端）</label>
<input id="frontHole">
</div>

<div class="row">
<label>穴位置（尾端）</label>
<input id="rearHole">
</div>

<div class="row">
<label>ゲージ</label>
<input id="gauge">
</div>

<div class="row">
<label>逆ゲージ</label>
<input id="revGauge">
</div>

<div class="row">
<label>X</label>
<input id="x">
</div>

<div class="row">
<label>Y</label>
<input id="y">
</div>

<div class="row">
<label>角度(°)</label>
<input id="angle">
</div>

<div id="error"></div>

<div class="result">

<div>先端 a寸法：<span id="fa"></span></div>
<div>先端 b寸法：<span id="fb"></span></div>

<hr>

<div>尾端 a寸法：<span id="ra"></span></div>
<div>尾端 b寸法：<span id="rb"></span></div>

</div>

</div>

<script>

document.querySelectorAll("input").forEach(i=>{
    i.addEventListener("input",calc);
});

function num(v){
    if(v==="") return "";
    return Number(v);
}

function roundExcel(v){
    return Math.round(v);
}

function calc(){

    document.getElementById("error").textContent="";

    const ids=["width","frontHole","rearHole","gauge","revGauge","x","y","angle"];

    for(const id of ids){

        const v=document.getElementById(id).value.trim();

        if(v!=="" && isNaN(v)){
            document.getElementById("error").textContent="数値を入力してください。";
            return;
        }

    }

    const W=num(width.value);
    const FH=num(frontHole.value);
    const RH=num(rearHole.value);
    const G=num(gauge.value);
    const RG=num(revGauge.value);
    const X=num(x.value);
    const Y=num(y.value);

    let ang;

    if(angle.value!==""){
        ang=num(angle.value);
    }else if(X!=="" && Y!=="" && X!==0){
        ang=Math.atan(Y/X)*180/Math.PI;
    }else{
        ang="";
    }

    if(W===""||FH===""||G===""){
        fa.textContent="";
        fb.textContent="";
        ra.textContent="";
        rb.textContent="";
        return;
    }

    if(ang===""){
        fa.textContent="";
        fb.textContent="";
        return;
    }

    const r=ang*Math.PI/180;

    // Excelの COS()^-1 = 1/COS()
    const sec=1/Math.cos(r);

    const tan=Math.tan(r);

    const frontA=roundExcel(((G-sec*W)/tan)+FH)+1;

    const frontB=roundExcel((((G-sec*W)/tan)+FH)*tan)+1;

    fa.textContent=frontA;
    fb.textContent=frontB;

    if(RH!=="" && RG!==""){

        const rearA=roundExcel(((RG-sec*W)/tan)+RH)+1;

        const rearB=roundExcel((((RG-sec*W)/tan)+RH)*tan)+1;

        ra.textContent=rearA;
        rb.textContent=rearB;

    }else{

        ra.textContent="";
        rb.textContent="";

    }

}

</script>

</body>
</html>
